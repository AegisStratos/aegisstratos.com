<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aegis Stratos | Protection through innovation</title>
<meta name="description" content="Aegis Stratos builds Physical AI to protect people and critical infrastructure from the drone threat, at a price defenders can sustain.">
<meta name="theme-color" content="#0A1A2F">
<link rel="canonical" href="https://aegisstratos.com/">
<meta property="og:title" content="Aegis Stratos | Protection through innovation">
<meta property="og:description" content="Physical AI to protect people and critical infrastructure from the drone threat, at a price defenders can sustain.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aegisstratos.com/">
<meta property="og:image" content="https://aegisstratos.com/assets/og.jpg">
<link rel="icon" href="assets/logos/badge.png">
<link rel="preload" href="assets/fonts/Montserrat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Fixed film stage: one video element plays every chapter film -->
<div id="stage" aria-hidden="true">
  <video id="film" playsinline webkit-playsinline preload="metadata"></video>
  <div id="stage-dim"></div>
</div>

<header id="top">
  <a class="brand" href="#hero" aria-label="Aegis Stratos, back to top"><img src="assets/logos/badge.png" alt="Aegis Stratos" width="64" height="64"></a>
  <nav id="nav" aria-label="Sections"></nav>
  <button id="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>
</header>

<div id="rail" aria-hidden="true"></div>
<div id="caption" aria-live="off"></div>

<!-- Film controls -->
<div id="controls" hidden>
  <button id="play-btn" aria-label="Play film"><svg viewBox="0 0 24 24" width="28" height="28"><path id="play-icon" d="M7 4l14 8-14 8z" fill="currentColor"/></svg></button>
  <button id="sound-btn" aria-pressed="false"><span class="eq"><i></i><i></i><i></i></span><span id="sound-label">Tap for sound</span></button>
  <div id="film-progress"><i></i></div>
</div>

<main id="main">
  <section id="hero">
    <div class="hero-art" id="hero-art"></div>
    <div class="hero-inner">
      <img class="lockup" src="assets/logos/lockup-gold.png" alt="Aegis Stratos" width="220">
      <p class="kicker" id="hero-kicker"></p>
      <h1 id="hero-title"></h1>
      <p class="lede" id="hero-sub"></p>
      <div class="hero-actions">
        <button class="btn gold" id="enter-sound">Enter with sound</button>
        <button class="btn ghost" id="enter-muted">Enter without sound</button>
      </div>
    </div>
    <div class="scroll-cue" aria-hidden="true"><span></span>Scroll</div>
  </section>
  <div id="chapters"></div>
</main>

<footer>
  <img src="assets/logos/badge.png" alt="" width="64" height="64">
  <p id="footer-note"></p>
  <p class="legal">© 2026 Aegis Stratos Ltd, London, United Kingdom.</p>
  <nav aria-label="Legal"><a href="privacy.html">Privacy</a><a href="#" id="cookie-settings">Cookie settings</a></nav>
</footer>

<!-- Product film player (used when a product film is switched on) -->
<dialog id="player">
  <button id="player-close" aria-label="Close film">Close</button>
  <video id="player-video" playsinline controls></video>
</dialog>

<!-- Cookie banner -->
<div id="cookies" role="dialog" aria-label="Cookies" hidden>
  <p><strong>Your choices.</strong> We store your sound and privacy choices on this device so the site works. With your permission we also count visits, without cookies, to improve the site.</p>
  <div>
    <button class="btn ghost small" id="cookies-essential">Essential only</button>
    <button class="btn gold small" id="cookies-all">Accept all</button>
  </div>
</div>

<script src="site.config.js"></script>
<script src="app.js"></script>
</body>
</html>
